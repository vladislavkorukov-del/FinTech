name: finora
description: Offline-first personal and family finance for Android.
publish_to: none
version: 1.62.0+74

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  crypto: ^3.0.6
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  image_picker: ^1.2.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/services/
    - assets/services/raster/
    - assets/banks/raster/
    - assets/stores/raster/
    - assets/brand/
    - assets/ocr/
    - assets/ocr/tessdata/
    - assets/finora/achievements/
    - assets/finora/wardrobe/
    - assets/companions/
    - assets/capes/
    - assets/finora/wardrobe_pack/
    - assets/finora/world/home/backgrounds/
    - assets/finora/world/garden/background/
    - assets/finora/world/garden/stages/
    - assets/finora/world/ui/png/
    - assets/flow/
    - assets/finora/match3/audio/
    - assets/finora/match3/tiles/
    - assets/finora/match3/hud/
    - assets/finora/match3/boosters/
    - assets/finora/match3/pause/
    - assets/finora/match3/victory/
    - assets/finora/match3/out_of_moves/
    - assets/finora/match3/map/
    - assets/finora/match3/prelevel/
    - assets/finora/match3/obstacles/
    - assets/finora/match3/special/
    - assets/finora/match3/playfield/
  # Inter 4.1 (SIL OFL 1.1, assets/fonts/inter/OFL.txt): the app's text face.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    # Finora Potok (SIL OFL 1.1, from Noto Sans; assets/fonts/finora_potok/OFL.txt):
    # the brand face of Finora's world.
    - family: FinoraPotok
      fonts:
        - asset: assets/fonts/finora_potok/FinoraPotok-Regular.ttf
          weight: 400
        - asset: assets/fonts/finora_potok/FinoraPotok-Bold.ttf
          weight: 700
