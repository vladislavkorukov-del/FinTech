name: finora
description: Offline-first personal and family finance for Android.
publish_to: none
version: 1.20.1+31

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  crypto: ^3.0.6
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  image_picker: ^1.2.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/services/
    - assets/services/raster/
    - assets/banks/raster/
    - assets/stores/raster/
    - assets/brand/
    - assets/ocr/
    - assets/ocr/tessdata/
